apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: drn-project-bootstrap
  namespace: argocd
spec:
  # Admin-only: managing AppProjects and Applications grants indirect cluster authority.
  sourceRepos:
    - https://github.com/duranserkan/DRN-Project-Argo-CD-Gitops.git
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: AppProject
