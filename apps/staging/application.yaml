apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: drn-project
  namespace: argocd
spec:
  project: drn-project-bootstrap
  source:
    repoURL: https://github.com/duranserkan/DRN-Project-Argo-CD-Gitops.git
    path: deployment
    # Publish preview003 with the staging chart and overlay paths before applying this root.
    # Do not move or recreate an existing tag.
    targetRevision: refs/tags/2026.10.1-preview003
    helm:
      parameters:
        - name: environment
          value: staging
        - name: gitRevision
          value: $ARGOCD_APP_REVISION
          forceString: true
        - name: releaseTag
          value: $ARGOCD_APP_SOURCE_TARGET_REVISION
          forceString: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Deliberate root sync promotes a snapshot. Children reconcile their selected sources.
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=false
