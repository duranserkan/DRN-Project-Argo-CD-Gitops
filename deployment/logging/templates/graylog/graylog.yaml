{{- if or (ne .Values.infrastructureProfile "retained") (ne .Values.activationStage "prepare") }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: graylog
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
# https://artifacthub.io/packages/helm/graylog2/graylog/2.1.0
spec:
  project: graylog
  source:
    chart: graylog
    repoURL: https://graylog2.github.io/graylog-helm
    # Official chart archive SHA256, verified against the publisher's index.
    # cdbda2dbf1839fa4306ba453c9a8639c442852c748156a9fe6f6530e60101cbb
    targetRevision: 2.1.0
    helm:
      skipTests: true
      valuesObject:
        global:
          # Created and preserved by the MongoDB credential bootstrap Job.
          existingSecretName: graylog-credentials
          {{- if eq .Values.infrastructureProfile "retained" }}
          storageClass: {{ .Values.retainedStorageClass | quote }}
          {{- end }}
        mongodb:
          communityResource:
            enabled: false
        extraObjects:
          {{- if ne .Values.infrastructureProfile "retained" }}
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: namespace-isolation
            spec:
              podSelector: {}
              policyTypes: [Ingress]
              ingress:
                - from:
                    - podSelector: {}
                - from:
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: drn-project
                  ports:
                    - port: 12201
                    # Linkerd transports meshed connections on its inbound port.
                    - port: 4143
                - from:
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: linkerd-viz
                  ports:
                    - port: 4191
                    - port: 4190
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: mongodb-operator-webhook
            spec:
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: mongodb-kubernetes-operator
                  app.kubernetes.io/component: controller
              policyTypes: [Ingress]
              ingress:
                # Managed API servers may not originate from namespace-selected pods.
                # Restrict the source once the cluster's API-server CIDRs are known.
                - ports:
                    - port: 1993
          {{- end }}
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: graylog-drn-content-packs
            data:
              drn-inputs.json: |
                {
                  "v": "1",
                  "id": "6ab9a143-a536-475b-bb99-0534484cc821",
                  "rev": 1,
                  "name": "DRN input",
                  "summary": "GELF HTTP input for DRN Apps",
                  "description": "Accepts newline-separated GELF batches from DRN Apps and extracts scoped log fields.",
                  "vendor": "DRN",
                  "url": "https://github.com/duranserkan/DRN-Project-Argo-CD-Gitops",
                  "parameters": [],
                  "entities": [{
                    "v": "1",
                    "id": "1ca5e0eb-44b4-438a-ad96-4a7af7735f0e",
                    "type": {"name": "input", "version": "1"},
                    "data": {
                      "title": {"@type": "string", "@value": "DRN GELF HTTP"},
                      "type": {"@type": "string", "@value": "org.graylog2.inputs.gelf.http.GELFHttpInput"},
                      "global": {"@type": "boolean", "@value": true},
                      "configuration": {
                        "bind_address": {"@type": "string", "@value": "0.0.0.0"},
                        "port": {"@type": "integer", "@value": 12201},
                        "enable_bulk_receiving": {"@type": "boolean", "@value": true},
                        "enable_cors": {"@type": "boolean", "@value": false}
                      },
                      "static_fields": {},
                      "extractors": [{
                        "title": {"@type": "string", "@value": "DRN scoped logs"},
                        "type": {"@type": "string", "@value": "JSON"},
                        "cursor_strategy": {"@type": "string", "@value": "COPY"},
                        "source_field": {"@type": "string", "@value": "full_message"},
                        "target_field": {"@type": "string", "@value": ""},
                        "configuration": {
                          "flatten": {"@type": "boolean", "@value": false},
                          "key_separator": {"@type": "string", "@value": "_"},
                          "key_prefix": {"@type": "string", "@value": "scope_"}
                        },
                        "converters": [],
                        "condition_type": {"@type": "string", "@value": "NONE"},
                        "condition_value": {"@type": "string", "@value": ""},
                        "order": {"@type": "integer", "@value": 0}
                      }]
                    },
                    "constraints": []
                  }]
                }
              drn-streams.json: |
                {
                  "v": "1",
                  "id": "e44645b8-26b6-4cc7-a5d9-0d93e39ccc3f",
                  "rev": 1,
                  "name": "DRN streams",
                  "summary": "Scoped log stream for DRN Apps",
                  "description": "Routes messages carrying scope_ScopedLog=true to the DRN stream.",
                  "vendor": "DRN",
                  "url": "https://github.com/duranserkan/DRN-Project-Argo-CD-Gitops",
                  "parameters": [],
                  "entities": [{
                    "v": "1",
                    "id": "b72dd514-12a4-4c63-b236-a2e6f31d1efb",
                    "type": {"name": "stream", "version": "1"},
                    "data": {
                      "title": {"@type": "string", "@value": "DRN"},
                      "description": {"@type": "string", "@value": "DRN scoped logs identified by scope_ScopedLog=true."},
                      "disabled": {"@type": "boolean", "@value": false},
                      "matching_type": {"@type": "string", "@value": "AND"},
                      "stream_rules": [{
                        "type": {"@type": "string", "@value": "EXACT"},
                        "field": {"@type": "string", "@value": "scope_ScopedLog"},
                        "value": {"@type": "string", "@value": "true"},
                        "inverted": {"@type": "boolean", "@value": false},
                        "description": {"@type": "string", "@value": "Messages carrying the ScopedLog=true marker extracted from full_message."}
                      }],
                      "alert_conditions": [],
                      "alarm_callbacks": [],
                      "outputs": [],
                      "default_stream": {"@type": "boolean", "@value": false},
                      "remove_matches": {"@type": "boolean", "@value": true}
                    },
                    "constraints": []
                  }]
                }
        graylog:
          enterprise: false
          replicas: 1
          config:
            extraServerJavaOpts:
              - -Djavax.net.ssl.trustStore=/etc/graylog/database-trust/truststore.p12
              - -Djavax.net.ssl.trustStoreType=PKCS12
              - -Djavax.net.ssl.trustStorePassword=changeit
            contentPacksAutoInstall: "drn-inputs.json,drn-streams.json"
            network:
              externalUri: "http://localhost:9000/"
          env:
            GRAYLOG_CONTENT_PACKS_LOADER_ENABLED: "true"
            GRAYLOG_CONTENT_PACKS_DIR: /etc/graylog/contentpacks
          extraVolumes:
            - name: database-trust
              configMap:
                name: graylog-database-trust
            - name: drn-content-packs
              configMap:
                name: graylog-drn-content-packs
          extraVolumeMounts:
            - name: database-trust
              mountPath: /etc/graylog/database-trust
              readOnly: true
            - name: drn-content-packs
              mountPath: /etc/graylog/contentpacks
              readOnly: true
          image:
            tag: 7.2.1@sha256:ed3f6008881f16315d16b0c8d3c6abe689ebe647e14fb5f3ba8bc034fa424776
          service:
            nameOverride: drn-graylog
          # Only GELF HTTP. The chart still declares port 13302, but no
          # Forwarder listener starts unless its input is created in Graylog.
          inputs:
            - name: gelf-http
              port: 12201
              protocol: TCP
          podAnnotations:
            linkerd.io/inject: enabled
            config.linkerd.io/default-inbound-policy: all-authenticated
          podDisruptionBudget:
            enabled: false
        datanode:
          replicas: 1
          {{- if eq .Values.infrastructureProfile "retained" }}
          roles: [cluster_manager, data, ingest, remote_cluster_client]
          env:
            GRAYLOG_DATANODE_PATH_REPO: /var/lib/graylog-datanode/drn-backups
          extraInitContainers:
            - name: backup-directory
              image: graylog/graylog-datanode:7.2.1@sha256:e1486024c7db955c8c216147c3ef22f4163355b4cedd3a48d2ee99e3d88a70d5
              command: [mkdir, -p, /var/lib/graylog-datanode/drn-backups]
              securityContext:
                runAsNonRoot: true
                runAsUser: 999
                runAsGroup: 999
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: data
                  mountPath: /var/lib/graylog-datanode
          {{- end }}
          config:
            javaOpts: "-Xms1g -Xmx1g -Djavax.net.ssl.trustStore=/etc/graylog/database-trust/truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=changeit"
          extraVolumes:
            - name: database-trust
              configMap:
                name: graylog-database-trust
          extraVolumeMounts:
            - name: database-trust
              mountPath: /etc/graylog/database-trust
              readOnly: true
          image:
            tag: 7.2.1@sha256:e1486024c7db955c8c216147c3ef22f4163355b4cedd3a48d2ee99e3d88a70d5
          podAnnotations:
            linkerd.io/inject: disabled
          podDisruptionBudget:
            enabled: false
  destination:
    namespace: graylog
    server: https://kubernetes.default.svc
  # Chart 2.1.0 always renders this field; Kubernetes drops it when
  # MaxUnavailableStatefulSet is disabled.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: graylog
      namespace: graylog
      jsonPointers:
        - /spec/updateStrategy/rollingUpdate/maxUnavailable
    - group: apps
      kind: StatefulSet
      name: graylog-datanode
      namespace: graylog
      jsonPointers:
        - /spec/updateStrategy/rollingUpdate/maxUnavailable
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
{{- end }}
