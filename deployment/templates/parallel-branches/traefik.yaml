apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "90"
spec:
  project: networking
  source:
    chart: traefik
    repoURL: https://traefik.github.io/charts
    # Verified 2026-10-25 against https://traefik.github.io/charts/index.yaml and chart bytes.
    # SHA-256: 10ec2b032fd7ec9fa04a8816872e20ba0fafc47231f6394b5cb5d522f3b0ef50
    targetRevision: 42.1.3
    helm:
      skipCrds: true
      valuesObject:
        image:
          # Verified 2026-10-25 against docker.io/library/traefik:v3.7.16.
          digest: sha256:c8a121e4bb1347e8fd52657fab12f2cb70b68f8a018895e2068f92c9e519b9c2
        versionOverride: v3.7.16
        deployment:
          podAnnotations:
            linkerd.io/inject: enabled
            # Port 4143 is public mesh transport. Only the web Server grants access.
            config.linkerd.io/default-inbound-policy: deny
        ingressClass:
          enabled: false
        providers:
          kubernetesCRD:
            enabled: false
          kubernetesIngress:
            enabled: false
          kubernetesGateway:
            enabled: true
            nativeLBByDefault: true
            namespaces:
              - drn-project
        gateway:
          name: drn-project
        api:
          dashboard: false
        ports:
          websecure:
            expose:
              default: false
        extraObjects:
          # External clients have no mesh identity. Keep this exception on the public listener only.
          - apiVersion: policy.linkerd.io/v1beta3
            kind: Server
            metadata:
              name: traefik-public-web
            spec:
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: traefik
                  app.kubernetes.io/instance: traefik-drn-project
              port: web
              # Public cleartext traffic is HTTP/1.1. Backend Services select h2c separately.
              proxyProtocol: HTTP/1
              accessPolicy: all-unauthenticated
  destination:
    namespace: drn-project
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
