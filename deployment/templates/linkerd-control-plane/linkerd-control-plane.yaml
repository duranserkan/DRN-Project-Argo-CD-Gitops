apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: linkerd-control-plane
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "70"
# https://artifacthub.io/packages/helm/linkerd2-edge/linkerd-control-plane/2026.10.1
spec:
  project: linkerd
  source:
    chart: linkerd-control-plane
    repoURL: https://helm.linkerd.io/edge
    targetRevision: 2026.10.1
    helm:
      parameters:
        - name: proxy.defaultInboundPolicy
          value: all-authenticated
        - name: controllerImage
          value: ghcr.io/linkerd/controller
        - name: controllerImageVersion
          value: edge-26.10.1@sha256:880437e01bbd4bf3d8fa7b56996c4ed5dd6551843363dc851ddd0b298b923e8a
        - name: proxy.image.name
          value: ghcr.io/linkerd/proxy
        - name: proxy.image.version
          # This standard proxy build prefers X25519MLKEM768 by default; no PQ toggle is needed.
          # Certificate authentication remains ECDSA. See README's post-quantum support section.
          value: edge-26.10.1@sha256:f2add36071cfca33754d2930800860785aaed672590bc0207be2f4da9889eb11
        - name: debugContainer.image.name
          value: ghcr.io/linkerd/debug
        - name: debugContainer.image.version
          value: edge-26.10.1@sha256:5fedca981aeeea65cf9934f1c4e1a347697f6aa4c620dbf213c83ce8b2aac784
        - name: webhookFailurePolicy
          value: Fail
        - name: identity.issuer.scheme
          value: kubernetes.io/tls
        - name: identity.externalCA
          value: "true"
        - name: policyValidator.externalSecret
          value: "true"
        - name: proxyInjector.externalSecret
          value: "true"
        - name: profileValidator.externalSecret
          value: "true"
        - name: policyValidator.injectCaFrom
          value: "linkerd/linkerd-policy-validator"
        - name: proxyInjector.injectCaFrom
          value: "linkerd/linkerd-proxy-injector"
        - name: profileValidator.injectCaFrom
          value: "linkerd/linkerd-sp-validator"
        - name: proxyInit.runAsRoot # (<https://github.com/linkerd/linkerd2/issues/7308>)
          value: "true"
  destination:
    namespace: linkerd
    server: https://kubernetes.default.svc
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: linkerd-proxy-injector-k8s-tls
      jsonPointers:
        - /data/tls.crt
        - /data/tls.key
    - group: ""
      kind: Secret
      name: linkerd-sp-validator-k8s-tls
      jsonPointers:
        - /data/tls.crt
        - /data/tls.key
    - group: ""
      kind: Secret
      name: linkerd-policy-validator-k8s-tls
      jsonPointers:
        - /data/tls.crt
        - /data/tls.key
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: linkerd-proxy-injector-webhook-config
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: linkerd-sp-validator-webhook-config
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: linkerd-policy-validator-webhook-config
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      # Preserve cert-manager's injected CA bundles during sync.
      - RespectIgnoreDifferences=true
