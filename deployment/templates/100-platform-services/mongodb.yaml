apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongodb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "100"
spec:
  project: graylog
  source:
    path: infrastructure/graylog/mongodb
    repoURL: {{ .Values.repository | quote }}
    targetRevision: {{ .Values.gitRevision | quote }}
  destination:
    namespace: graylog
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
