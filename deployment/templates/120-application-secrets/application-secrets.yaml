{{- if eq .Values.environment "stage" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: application-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "120"
spec:
  project: application-secrets
  source:
    path: infrastructure/application-secrets/stage
    repoURL: {{ .Values.repository | quote }}
    targetRevision: {{ .Values.gitRevision | quote }}
  destination:
    namespace: drn-project
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: false
      prune: false
    syncOptions:
      - ApplyOutOfSyncOnly=false
{{- end }}
