apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongodb-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
# https://artifacthub.io/packages/helm/mongodb-helm-charts/mongodb-kubernetes/1.14.0
spec:
  project: graylog
  source:
    chart: mongodb-kubernetes
    repoURL: https://mongodb.github.io/helm-charts
    # Official chart archive SHA256, verified against the publisher's index.
    # da4a213f2300dfd82428d28be949765110ac30af857aa1e02b4d8f96dbc687cd
    targetRevision: 1.14.0
    helm:
      valuesObject:
        operator:
          version: 1.14.0@sha256:47c6df5ec4615c554de9532929961589d02fffbe2dd3133460cc61f3e05d32fb
          watchedResources:
            - mongodbcommunity
          enableClusterMongoDBRoles: false
          telemetry:
            enabled: false
        community:
          agent:
            version: 109.0.1.9310-1@sha256:cad96df67cee50d9faf4d53bdf4b4b7333902a3fee824ad7be0cc6034f8a597b
        versionUpgradeHook:
          version: 1.0.10@sha256:5d776a05cd8e2b897e441904126c198230294ebc3c03e6a8830b1c7d6c92af42
        readinessProbe:
          version: 1.0.24@sha256:75ff5bd1aebdb82776de008e96433ebe93a17b0a3a4be6cced270b76b67e0bb1
  destination:
    namespace: graylog
    server: https://kubernetes.default.svc
  syncPolicy:
    managedNamespaceMetadata:
      annotations:
        linkerd.io/inject: disabled
    automated:
      selfHeal: true
      # Retain operator CRDs and database resources during pruning.
      prune: false
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
