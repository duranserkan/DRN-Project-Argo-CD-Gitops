apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: grafana
  source:
    chart: grafana
    repoURL: https://grafana-community.github.io/helm-charts
    # Chart SHA256 verified 2026-10-17.
    # 4dbc6ed68ee29e78edd4db47d10aad72f8fc473e4169501a2bdaf149463e74df
    targetRevision: 14.0.1
    helm:
      skipTests: true
      valuesObject:
        fullnameOverride: grafana
        image:
          tag: 13.2.4-distroless
          sha: ae3d3add290adbe6a88412229f5d76fd7bb82743050881698642d3d62f277e35
        downloadDashboardsImage:
          tag: 8.23.0
          sha: a134550be58ab783810e613ae96fd253c38f7bdd16d9bf9be350700c7a29ac06
        rbac:
          create: false
        serviceAccount:
          name: grafana
        testFramework:
          enabled: false
        initChownData:
          enabled: false
        persistence:
          enabled: false
        podAnnotations:
          linkerd.io/inject: enabled
        env:
          GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        grafana.ini:
          server:
            root_url: "%(protocol)s://%(domain)s/grafana/"
          auth:
            disable_login_form: true
          auth.anonymous:
            enabled: true
            org_role: Viewer
          auth.basic:
            enabled: false
          analytics:
            check_for_updates: false
            reporting_enabled: false
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: prometheus
                type: prometheus
                access: proxy
                url: http://prometheus.linkerd-viz.svc.cluster.local:9090
                isDefault: true
                editable: false
                jsonData:
                  timeInterval: "10s"
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: default
                orgId: 1
                folder: Linkerd
                type: file
                disableDeletion: true
                editable: false
                options:
                  path: /var/lib/grafana/dashboards/default
        # Verify TLS certificates when downloading dashboards.
        defaultCurlOptions: "-sf"
        # Dashboard revisions from Linkerd edge-26.10.1/grafana/values.yaml.
        dashboards:
          default:
            top-line: {gnetId: 15474, revision: 4, datasource: prometheus}
            health: {gnetId: 15486, revision: 3, datasource: prometheus}
            kubernetes: {gnetId: 15479, revision: 2, datasource: prometheus}
            namespace: {gnetId: 15478, revision: 3, datasource: prometheus}
            deployment: {gnetId: 15475, revision: 6, datasource: prometheus}
            pod: {gnetId: 15477, revision: 3, datasource: prometheus}
            service: {gnetId: 15480, revision: 3, datasource: prometheus}
            route: {gnetId: 15481, revision: 3, datasource: prometheus}
            authority: {gnetId: 15482, revision: 3, datasource: prometheus}
            cronjob: {gnetId: 15483, revision: 3, datasource: prometheus}
            job: {gnetId: 15487, revision: 3, datasource: prometheus}
            daemonset: {gnetId: 15484, revision: 3, datasource: prometheus}
            replicaset: {gnetId: 15491, revision: 3, datasource: prometheus}
            statefulset: {gnetId: 15493, revision: 3, datasource: prometheus}
            replicationcontroller: {gnetId: 15492, revision: 4, datasource: prometheus}
            prometheus: {gnetId: 15489, revision: 2, datasource: prometheus}
            prometheus-benchmark: {gnetId: 15490, revision: 2, datasource: prometheus}
            multicluster: {gnetId: 15488, revision: 3, datasource: prometheus}
        extraObjects:
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: namespace-isolation
            spec:
              podSelector: {}
              policyTypes: [Ingress]
              ingress:
                - from:
                    - podSelector: {}
                - from:
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: linkerd-viz
                  ports:
                    - port: 3000
                    - port: 4143
                    - port: 4191
                    - port: 4190
          - apiVersion: policy.linkerd.io/v1alpha1
            kind: AuthorizationPolicy
            metadata:
              name: grafana
              namespace: linkerd-viz
            spec:
              targetRef:
                group: policy.linkerd.io
                kind: Server
                name: prometheus-admin
              requiredAuthenticationRefs:
                - kind: ServiceAccount
                  name: grafana
                  namespace: grafana
  destination:
    namespace: grafana
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
