{{- if or (ne .Values.infrastructureProfile "retained") (ne .Values.activationStage "prepare") }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  project: drn-project
  source:
    path: services/sample/{{ .Values.environment }}
    repoURL: {{ .Values.repository | quote }}
    targetRevision: {{ .Values.gitRevision | quote }}
    {{- if eq .Values.infrastructureProfile "retained" }}
    kustomize:
      patches:
        - target:
            kind: PersistentVolumeClaim
            name: sample-data
          patch: |-
            - op: add
              path: /spec/storageClassName
              value: {{ .Values.retainedStorageClass | quote }}
        - target:
            kind: Deployment
            name: sample
          patch: |-
            - op: add
              path: /spec/replicas
              value: {{ ternary 1 0 (eq .Values.activationStage "workloads") }}
    {{- end }}
  destination:
    namespace: drn-project
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: {{ eq .Values.infrastructureProfile "retained" }}
      prune: true
    syncOptions:
      - ApplyOutOfSyncOnly=false
{{- end }}
