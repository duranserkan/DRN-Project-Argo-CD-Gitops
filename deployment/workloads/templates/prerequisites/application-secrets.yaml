{{- if and (eq .Values.environment "staging") (or (ne .Values.infrastructureProfile "retained") (ne .Values.activationStage "prepare")) }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: application-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: application-secrets
  source:
    path: infrastructure/application-secrets/staging
    repoURL: {{ .Values.repository | quote }}
    targetRevision: {{ .Values.gitRevision | quote }}
    {{- if eq .Values.infrastructureProfile "retained" }}
    kustomize:
      patches:
        - target:
            kind: Job
            name: application-secret-bootstrap
          patch: |-
            apiVersion: batch/v1
            kind: Job
            metadata:
              name: application-secret-bootstrap
            spec:
              template:
                spec:
                  containers:
                    - name: bootstrap
                      env:
                        - name: CREDENTIALS_EXTERNALLY_MANAGED
                          value: "true"
    {{- end }}
  destination:
    namespace: drn-project
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: false
      prune: false
    syncOptions:
      - ApplyOutOfSyncOnly=false
{{- end }}
