{{- if eq .Values.environment "staging" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: drn-project
  source:
    path: services/postgresql/{{ .Values.environment }}
    repoURL: {{ .Values.repository | quote }}
    targetRevision: {{ .Values.gitRevision | quote }}
  destination:
    namespace: drn-project
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
{{- end }}
