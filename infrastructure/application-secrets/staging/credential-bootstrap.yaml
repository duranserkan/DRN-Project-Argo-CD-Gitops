apiVersion: batch/v1
kind: Job
metadata:
  name: application-secret-bootstrap
  namespace: drn-project
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      # Pods use the namespace's default ServiceAccount unless a name is specified.
      # automountServiceAccountToken uses the Pod value, then the ServiceAccount value, then true.
      # Both omit it here. ServiceAccount admission adds the projected API credential volume.
      # Kubelet supplies token, ca.crt and namespace
      # at /var/run/secrets/kubernetes.io/serviceaccount using this identity.
      serviceAccountName: application-secret-bootstrap
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # Kubelet exposes the ConfigMap entries as files inside the container.
        - name: bootstrap-source
          configMap:
            name: application-secret-bootstrap-source
        - name: scratch
          # Writable SDK and NuGet scratch space, discarded with the Pod.
          emptyDir:
            sizeLimit: 512Mi
      initContainers:
        - name: runtime-directory
          image: mcr.microsoft.com/dotnet/sdk:10.0.402-alpine3.24@sha256:230c3fbae0ceedc70bca04eed2bfb5694e8b248cadbb81010f41b7a993601f55
          # XDG requires an existing directory owned by the process user with mode 0700.
          command: ["mkdir", "-p", "-m", "0700", "/tmp/runtime"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: scratch
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
              ephemeral-storage: 512Mi
      containers:
        - name: bootstrap
          image: mcr.microsoft.com/dotnet/sdk:10.0.402-alpine3.24@sha256:230c3fbae0ceedc70bca04eed2bfb5694e8b248cadbb81010f41b7a993601f55
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          workingDir: /tmp
          env:
            # Named mutexes use this directory in .NET 10.0.13 and later.
            - name: XDG_RUNTIME_DIR
              value: /tmp/runtime
            - name: DOTNET_CLI_HOME
              value: /tmp/dotnet-home
            - name: NUGET_PACKAGES
              value: /tmp/nuget
            - name: DOTNET_CLI_TELEMETRY_OPTOUT
              value: "1"
            - name: DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE
              value: "true"
            - name: DOTNET_EnableDiagnostics
              value: "0"
          volumeMounts:
            - name: bootstrap-source
              mountPath: /bootstrap
              readOnly: true
            - name: scratch
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 512Mi
          # Restore and run the mounted C# source with the SDK. No custom image is needed.
          command: ["dotnet"]
          args:
            - run
            - --file
            - /bootstrap/bootstrap.cs
            - --configuration
            - Release
            - --no-launch-profile
            - --disable-build-servers
            - --property:PublishAot=false
            - --property:NuGetAudit=false
            - --property:UseSharedCompilation=false
            - --property:RestoreConfigFile=/bootstrap/NuGet.Config
