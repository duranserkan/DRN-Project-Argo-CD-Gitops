apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: application-secret-bootstrap
  namespace: drn-project
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
# Authorize the Job's service account with the namespace-local bootstrap Role.
subjects:
  - kind: ServiceAccount
    name: application-secret-bootstrap
    namespace: drn-project
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: application-secret-bootstrap
