apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: application-secret-bootstrap
  namespace: drn-project
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    # Keep aligned with Applications in bootstrap.cs when adding consumers.
    resourceNames: ["nexus-settings", "sample-settings"]
    verbs: ["get"]
  # Kubernetes cannot restrict create by resourceNames. No update/delete access.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
