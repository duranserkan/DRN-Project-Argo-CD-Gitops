apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: drn-project
resources:
  - credential-bootstrap.yaml
  - credential-bootstrap-role.yaml
  - credential-bootstrap-role-binding.yaml
  - credential-bootstrap-service-account.yaml
configMapGenerator:
  - name: application-secret-bootstrap-source
    files:
      - bootstrap.cs
      - NuGet.Config
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
