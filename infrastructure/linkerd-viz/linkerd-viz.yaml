apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: linkerd-viz
  namespace: argocd
#https://artifacthub.io/packages/helm/linkerd2-edge/linkerd-viz/2026.7.2
spec:
  project: linkerd-viz
  source:
    chart: linkerd-viz
    repoURL: https://helm.linkerd.io/edge
    targetRevision: 2026.7.2
  destination:
    namespace: linkerd-viz
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
