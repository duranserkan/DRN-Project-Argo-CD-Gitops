apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongodb-operator-webhook
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mongodb-kubernetes-operator
      app.kubernetes.io/component: controller
  policyTypes: [Ingress]
  ingress:
    # The managed API server originates outside namespace-selected pods.
    - ports:
        - port: 1993
