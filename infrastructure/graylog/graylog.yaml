apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: graylog
  namespace: argocd
# https://artifacthub.io/packages/helm/graylog2/graylog/2.1.0
spec:
  project: graylog
  source:
    chart: graylog
    repoURL: https://graylog2.github.io/graylog-helm
    # Official chart archive SHA256, verified against the publisher's index.
    # cdbda2dbf1839fa4306ba453c9a8639c442852c748156a9fe6f6530e60101cbb
    targetRevision: 2.1.0
    helm:
      skipTests: true
      valuesObject:
        global:
          # Created and preserved by the MongoDB credential bootstrap Job.
          existingSecretName: graylog-credentials
        mongodb:
          communityResource:
            enabled: false
        graylog:
          enterprise: false
          replicas: 1
          config:
            network:
              externalUri: "http://localhost:9000/"
          image:
            tag: 7.1.8@sha256:aa2685186060b3a735f072e1e87368b6466728a1aee9c0338c3a407e4d032092
          service:
            nameOverride: drn-udp-gelf
          inputs:
            - name: gelf-udp
              port: 12201
              protocol: UDP
          podAnnotations:
            linkerd.io/inject: disabled
          podDisruptionBudget:
            enabled: false
        datanode:
          replicas: 1
          image:
            tag: 7.1.8@sha256:f44b03a0652c92dac1a0a494f6486783ff02879e2e4762f53073e69d4195dd3e
          podAnnotations:
            linkerd.io/inject: disabled
          podDisruptionBudget:
            enabled: false
  destination:
    namespace: graylog
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
