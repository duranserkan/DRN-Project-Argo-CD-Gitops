apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mongodb-readiness
  namespace: graylog
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["mongodb-config"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    # Keep this list aligned with the MongoDBCommunity member count.
    resourceNames: ["mongodb-0"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mongodb-readiness
  namespace: graylog
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: mongodb-kubernetes-database-pods
    namespace: graylog
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mongodb-readiness
