apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: graylog-credential-bootstrap
  namespace: graylog
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: graylog-credential-bootstrap
    namespace: graylog
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: graylog-credential-bootstrap
