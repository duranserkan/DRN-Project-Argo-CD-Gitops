apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: graylog-credential-bootstrap
  namespace: graylog
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - mongo-graylog-password
      - mongodb-graylog-graylog
      - graylog-admin-password
      - graylog-credentials
    verbs: ["get"]
  # Kubernetes cannot restrict create by resourceNames. No update/delete access.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
