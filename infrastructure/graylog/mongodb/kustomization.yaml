apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - credential-bootstrap.yaml
  - credential-bootstrap-role.yaml
  - credential-bootstrap-role-binding.yaml
  - credential-bootstrap-service-account.yaml
  - graylog-database-trust-bundle.yaml
  - mongodb-custom-resource.yaml
  - mongodb-server-certificate.yaml
  - readiness-role.yaml
  - readiness-role-binding.yaml
configMapGenerator:
  - name: graylog-credential-bootstrap-source
    namespace: graylog
    files:
      - bootstrap.cs
      - NuGet.Config
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
