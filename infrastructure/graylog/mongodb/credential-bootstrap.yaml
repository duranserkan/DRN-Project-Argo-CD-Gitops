apiVersion: batch/v1
kind: Job
metadata:
  name: graylog-credential-bootstrap
  namespace: graylog
  annotations:
    # MongoDB must be created in this phase while the Job waits for its URI.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1200
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      serviceAccountName: graylog-credential-bootstrap
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        # Match the SDK image's built-in app user and group.
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: bootstrap-source
          configMap:
            name: graylog-credential-bootstrap-source
        - name: scratch
          emptyDir:
            sizeLimit: 512Mi
      initContainers:
        - name: runtime-directory
          image: mcr.microsoft.com/dotnet/sdk:10.0.402-noble@sha256:0d99ebf1ccad15037b5c98c9fe8979d6b8dbac23812feae2277a0b277b5c5ffa
          # Create private runtime and application-data directories before SDK startup.
          command: ["mkdir", "-p", "-m", "0700", "/tmp/runtime", "/tmp/data"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: scratch
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
              ephemeral-storage: 512Mi
      containers:
        - name: bootstrap
          image: mcr.microsoft.com/dotnet/sdk:10.0.402-noble@sha256:0d99ebf1ccad15037b5c98c9fe8979d6b8dbac23812feae2277a0b277b5c5ffa
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          workingDir: /tmp
          env:
            # Named mutexes use this directory in .NET 10.0.13 and later.
            - name: XDG_RUNTIME_DIR
              value: /tmp/runtime
            # LocalApplicationData must resolve to an existing writable directory.
            - name: XDG_DATA_HOME
              value: /tmp/data
            - name: DOTNET_CLI_HOME
              value: /tmp/dotnet-home
            - name: NUGET_PACKAGES
              value: /tmp/nuget
            - name: DOTNET_CLI_TELEMETRY_OPTOUT
              value: "1"
            - name: DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE
              value: "true"
            - name: DOTNET_EnableDiagnostics
              value: "0"
          volumeMounts:
            - name: bootstrap-source
              mountPath: /bootstrap
              readOnly: true
            - name: scratch
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 512Mi
          command: ["dotnet"]
          args:
            - run
            - --file
            - /bootstrap/bootstrap.cs
            - --configuration
            - Release
            - --no-launch-profile
            - --disable-build-servers
            - --property:PublishAot=false
            - --property:NuGetAudit=false
            - --property:UseSharedCompilation=false
            - --property:RestoreConfigFile=/bootstrap/NuGet.Config
