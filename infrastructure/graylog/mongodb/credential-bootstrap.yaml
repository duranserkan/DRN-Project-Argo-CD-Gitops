apiVersion: v1
kind: ServiceAccount
metadata:
  name: graylog-credential-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: graylog-credential-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - mongo-graylog-password
      - mongodb-graylog-graylog
      - graylog-admin-password
      - graylog-credentials
    verbs: ["get"]
  # Kubernetes cannot restrict create by resourceNames. No update/delete access.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: graylog-credential-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: graylog-credential-bootstrap
    namespace: graylog
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: graylog-credential-bootstrap
---
apiVersion: batch/v1
kind: Job
metadata:
  name: graylog-credential-bootstrap
  annotations:
    # MongoDB must be created in this phase while the Job waits for its URI.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1200
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      serviceAccountName: graylog-credential-bootstrap
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: docker.io/library/node:26.10.0-alpine3.24@sha256:0b36e8c136b94cd4fcf02188228e76c31ad5872eef3fec8cbd2eee500cfd9e80
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
          command: ["node", "--input-type=module", "--eval"]
          args:
            - |
              import { randomBytes, createHash } from 'node:crypto';
              import { readFileSync } from 'node:fs';
              import { request as httpsRequest } from 'node:https';
              import { setTimeout as sleep } from 'node:timers/promises';

              const serviceAccount = '/var/run/secrets/kubernetes.io/serviceaccount';
              const namespace = readFileSync(`${serviceAccount}/namespace`, 'utf8').trim();
              const api = `https://kubernetes.default.svc/api/v1/namespaces/${namespace}/secrets`;
              const ca = readFileSync(`${serviceAccount}/ca.crt`);
              const randomPassword = (bytes) => randomBytes(bytes).toString('base64url');

              async function request(method, name = '', body) {
                const token = readFileSync(`${serviceAccount}/token`, 'utf8').trim();
                const payload = body === undefined ? undefined : Buffer.from(JSON.stringify(body));
                const headers = {
                  Authorization: `Bearer ${token}`,
                  'Content-Type': 'application/json',
                };
                if (payload) headers['Content-Length'] = payload.length;
                const response = await new Promise((resolve, reject) => {
                  const req = httpsRequest(api + (name ? `/${name}` : ''), {
                    method, headers, ca, agent: false,
                    signal: AbortSignal.timeout(30_000),
                  }, (res) => {
                    const chunks = [];
                    res.on('data', (chunk) => chunks.push(chunk));
                    res.on('end', () => resolve({
                      status: res.statusCode,
                      text: Buffer.concat(chunks).toString('utf8'),
                    }));
                    res.on('error', () => reject(new Error('Secret API response failed.')));
                  });
                  req.on('error', () => reject(new Error('Secret API request failed.')));
                  req.end(payload);
                });
                if (method === 'GET' && response.status === 404) return null;
                if (method === 'POST' && response.status === 409) {
                  return request('GET', body.metadata.name);
                }
                if (response.status < 200 || response.status >= 300) {
                  throw new Error(`Secret API ${method} failed with HTTP ${response.status}`);
                }
                try {
                  return JSON.parse(response.text);
                } catch {
                  throw new Error('Secret API returned invalid JSON.');
                }
              }

              async function ensure(name, values) {
                const existing = await request('GET', name);
                if (existing !== null) return existing;
                return request('POST', '', {
                  apiVersion: 'v1', kind: 'Secret', type: 'Opaque',
                  metadata: { name, namespace },
                  stringData: values,
                });
              }

              function value(secret, key) {
                const encoded = secret.data?.[key];
                if (!encoded) throw new Error(`Secret ${secret.metadata.name} is missing ${key}`);
                const decoded = Buffer.from(encoded, 'base64');
                if (decoded.toString('base64') !== encoded) {
                  throw new Error(`Secret ${secret.metadata.name} has invalid base64 for ${key}`);
                }
                try {
                  return new TextDecoder('utf-8', { fatal: true }).decode(decoded);
                } catch {
                  throw new Error(`Secret ${secret.metadata.name} has invalid UTF-8 for ${key}`);
                }
              }

              async function main() {
                let credentials = await request('GET', 'graylog-credentials');
                let database = await request('GET', 'mongo-graylog-password');
                if (credentials === null) {
                  const admin = await request('GET', 'graylog-admin-password');
                  const connection = await request('GET', 'mongodb-graylog-graylog');
                  // Partial bootstrap and lost credentials are indistinguishable. Fail closed.
                  if (database !== null || admin !== null || connection !== null) {
                    throw new Error('Existing bootstrap Secrets found without graylog-credentials. Restore graylog-credentials from backup. Refusing encryption secret regeneration, including after an interrupted first bootstrap.');
                  }
                }
                if (credentials !== null && database === null) {
                  throw new Error('Restore mongo-graylog-password from backup. Refusing password regeneration.');
                }
                if (database === null) {
                  database = await ensure('mongo-graylog-password', { password: randomPassword(48) });
                }
                value(database, 'password');
                if (credentials === null) {
                  const admin = await ensure('graylog-admin-password', { password: randomPassword(32) });
                  const password = value(admin, 'password');
                  const deadline = performance.now() + 900_000;
                  let uri;
                  console.log('Waiting for the MongoDB operator connection Secret.');
                  while (performance.now() < deadline) {
                    const connection = await request('GET', 'mongodb-graylog-graylog');
                    if (connection?.data?.['connectionString.standard']) {
                      uri = value(connection, 'connectionString.standard');
                      break;
                    }
                    await sleep(5_000);
                  }
                  if (uri === undefined) throw new Error('Timed out waiting for the MongoDB connection URI.');
                  credentials = await ensure('graylog-credentials', {
                    GRAYLOG_ROOT_USERNAME: 'admin',
                    GRAYLOG_ROOT_PASSWORD_SHA2: createHash('sha256').update(password).digest('hex'),
                    GRAYLOG_PASSWORD_SECRET: randomPassword(48),
                    GRAYLOG_MONGODB_URI: uri,
                  });
                }
                for (const key of ['GRAYLOG_ROOT_USERNAME', 'GRAYLOG_ROOT_PASSWORD_SHA2',
                                  'GRAYLOG_PASSWORD_SECRET', 'GRAYLOG_MONGODB_URI']) {
                  value(credentials, key);
                }
                console.log('Credentials are ready. Existing Secrets were preserved.');
              }

              main().catch((error) => {
                console.error(error.message);
                process.exitCode = 1;
              });
