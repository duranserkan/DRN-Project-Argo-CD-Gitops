apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongodb-operator
  namespace: argocd
# https://artifacthub.io/packages/helm/mongodb-helm-charts/mongodb-kubernetes/1.13.0
spec:
  project: graylog
  source:
    chart: mongodb-kubernetes
    repoURL: https://mongodb.github.io/helm-charts
    # Official chart archive SHA256, verified against the publisher's index.
    # 6db616c756bfcd25a575722b024c852a030a0cc985e7b168aff0ae4049c7e13b
    targetRevision: 1.13.0
    helm:
      valuesObject:
        operator:
          version: 1.13.0@sha256:0184a96e324f8fb6c53bedb8f859762166fe7e996d00214efe3ec51a502b3db3
          watchedResources:
            - mongodbcommunity
          enableClusterMongoDBRoles: false
          telemetry:
            enabled: false
        community:
          agent:
            version: 109.0.0.9285-1@sha256:2d819aff81c5d9be80017791ad9e6f8c0fef828b476c9ed1cba8fe9838b07cd2
        versionUpgradeHook:
          version: 1.0.10@sha256:65e653bd319022328102bbd4aa8559810fe10282608af359e34e224e98116652
        readinessProbe:
          version: 1.0.24@sha256:dd861b4254ebf0458c460e9445fcda89a5b101ad39f9719fd09c33a99511d928
  destination:
    namespace: graylog
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    managedNamespaceMetadata:
      annotations:
        linkerd.io/inject: disabled
    automated:
      selfHeal: true
      # Retain operator CRDs and database resources during pruning.
      prune: false
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
