apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongodb
  namespace: argocd
spec:
  project: graylog
  source:
    repoURL: 'https://github.com/duranserkan/DRN-Project-Argo-CD-Gitops.git'
    path: infrastructure/graylog/mongodb
    targetRevision: 'preview'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: graylog
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
