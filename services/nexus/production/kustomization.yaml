apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Inactive scaffold. See docs/staging-configuration.md before activation.
resources:
  - ../base
namespace: drn-project
configMapGenerator:
  - name: nexus-config
    behavior: merge
    files:
      - mounted-settings.json
patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: nexus
