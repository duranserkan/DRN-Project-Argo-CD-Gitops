apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization #kubectl apply -k --dry-run=client -o yaml ./
resources:
  - ../base
namespace: drn-project-develop
#namePrefix: develop-
#nameSuffix: -0.2.2-preview002
images:
  - name: duranserkan/drn-project-nexus
    newTag: 0.10.1-preview002
    digest: sha256:1c4de89800bb60318749b3d3245ed882eaaf915587e2e3c9865cfba352180f0e
replicas:
  - name: nexus
    count: 1
configMapGenerator:
  - name: nexus-config
    files:
      - mounted-settings.json
patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: nexus
