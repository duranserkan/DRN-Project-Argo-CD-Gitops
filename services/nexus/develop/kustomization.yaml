apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization #kubectl apply -k --dry-run=client -o yaml ./
resources:
  - ../base
namespace: drn-project-develop
#namePrefix: develop-
#nameSuffix: -0.2.2-preview002
images:
  - name: duranserkan/drn-project-nexus
    newTag: 0.10.1-preview001
    digest: sha256:8232b62e3370bfc467abbd904b87aa912fd9cc7029f07eb29c8144fe1767fe9b
replicas:
  - name: nexus
    count: 1
configMapGenerator:
  - name: nexus-config
    files:
      - mounted-settings.json
patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: nexus
