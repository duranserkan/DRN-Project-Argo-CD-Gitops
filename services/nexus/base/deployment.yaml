apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus
  labels:
    app: nexus
spec:
  replicas: 1
  # Stop the old pod before reattaching its ReadWriteOnce data volume.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: nexus
  template:
    metadata:
      name: nexus
      labels:
        app: nexus
      annotations:
        linkerd.io/inject: enabled
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Always
      serviceAccountName: nexus
      containers:
        - name: nexus
          image: duranserkan/drn-project-nexus:0.10.1-preview006@sha256:5123568218111c9f9ce73c3346eb6148e8867a369bbb43334ef2af5efde7e866
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1654
            runAsGroup: 1654
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - mountPath: /appconfig/json-settings
              name: config
              readOnly: true
            - mountPath: /appdata
              name: app-data
            - mountPath: /apptemp
              name: app-temp
            - mountPath: /applogs
              name: app-logs
            - mountPath: /tmp
              name: runtime-temp
          ports:
          - containerPort: 5988
            name: http
            protocol: TCP
          - containerPort: 8081
            name: health
            protocol: TCP
          # Kubelet uses HTTP/1 on the separate listener; service traffic stays h2c.
          startupProbe:
            httpGet:
              path: /Api/WeatherForecast
              port: health
              httpHeaders:
                - name: Host
                  value: nexus
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /Api/WeatherForecast
              port: health
              httpHeaders:
                - name: Host
                  value: nexus
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /Api/WeatherForecast
              port: health
              httpHeaders:
                - name: Host
                  value: nexus
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            limits:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 1Gi
      volumes:
        - name: config
          configMap:
            name: nexus-config
        - name: app-data
          persistentVolumeClaim:
            claimName: nexus-data
        - name: app-temp
          emptyDir: {}
        - name: app-logs
          emptyDir: {}
        - name: runtime-temp
          emptyDir: {}
