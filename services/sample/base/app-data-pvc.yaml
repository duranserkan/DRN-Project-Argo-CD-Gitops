apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sample-data
  labels:
    app: sample
  annotations:
    # Retire persistent data deliberately, including during Application deletion.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi
