apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sample
spec:
  parentRefs:
    - name: drn-project
      sectionName: web
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Prefix
                value: /api
            remove:
              - l5d-dst-override
              - X-Forwarded-Ssl
              - X-Original-URI
              - X-Forwarded-Path
      backendRefs:
        - name: sample
          port: 80
