apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample
  labels:
    app: sample
spec:
  replicas: 1
  # Stop the old pod before reattaching its ReadWriteOnce data volume.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: sample
  template:
    metadata:
      name: sample
      labels:
        app: sample
      annotations:
        linkerd.io/inject: enabled
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Always
      serviceAccountName: sample
      containers:
        - name: sample
          image: duranserkan/drn-project-sample:0.10.1-preview005@sha256:9e5a30802f8cb1c2a516d2acb1d6293ee74538da17587c7508bb0f85f12cca56
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1654
            runAsGroup: 1654
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - mountPath: /appconfig/json-settings
              name: config
              readOnly: true
            - mountPath: /appdata
              name: app-data
            - mountPath: /apptemp
              name: app-temp
            - mountPath: /applogs
              name: app-logs
            - mountPath: /tmp
              name: runtime-temp
          ports:
          - containerPort: 5998
            name: http
            protocol: TCP
          - containerPort: 8081
            name: health
            protocol: TCP
          # Kubelet uses HTTP/1 on the separate listener; service traffic stays h2c.
          startupProbe:
            httpGet:
              path: /Api/Sample/WeatherForecast
              port: health
              httpHeaders:
                - name: Host
                  value: sample
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /Api/Sample/WeatherForecast
              port: health
              httpHeaders:
                - name: Host
                  value: sample
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /Api/Sample/WeatherForecast
              port: health
              httpHeaders:
                - name: Host
                  value: sample
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            limits:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 1Gi
      volumes:
        - name: config
          configMap:
            name: sample-config
        - name: app-data
          persistentVolumeClaim:
            claimName: sample-data
        - name: app-temp
          emptyDir: {}
        - name: app-logs
          emptyDir: {}
        - name: runtime-temp
          emptyDir: {}
