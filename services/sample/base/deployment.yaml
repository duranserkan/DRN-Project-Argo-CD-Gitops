apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample
  labels:
    app: sample
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample
  template:
    metadata:
      name: sample
      labels:
        app: sample
      annotations:
        linkerd.io/inject: enabled
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Always
      serviceAccountName: sample
      containers:
        - name: sample
          image: duranserkan/drn-project-sample:0.10.1-preview001@sha256:10300ff82bd730dc77126c3a71bdea62c34ac32986ad44984b83293655347a41
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1654
            runAsGroup: 1654
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - mountPath: /appconfig/json-settings
              name: config
              readOnly: true
            - mountPath: /appdata
              name: app-data
            - mountPath: /apptemp
              name: app-temp
            - mountPath: /applogs
              name: app-logs
            - mountPath: /tmp
              name: runtime-temp
          ports:
          - containerPort: 5998
            name: http
            protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 100Mi
              ephemeral-storage: "250M"
            requests:
              cpu: 100m
              memory: 100Mi
              ephemeral-storage: "250M"
      volumes:
        - name: config
          configMap:
            name: sample-config
        - name: app-data
          emptyDir: {}
        - name: app-temp
          emptyDir: {}
        - name: app-logs
          emptyDir: {}
        - name: runtime-temp
          emptyDir: {}
