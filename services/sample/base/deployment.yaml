apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample
  labels:
    app: sample
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample
  template:
    metadata:
      name: sample
      labels:
        app: sample
      annotations:
        linkerd.io/inject: enabled
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Always
      serviceAccountName: sample
      containers:
        - name: sample
          image: duranserkan/drn-project-sample:0.10.1-preview003@sha256:896e209a8282179dab11533f919134acdb11996b24819a4b64987d87b951a6ff
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1654
            runAsGroup: 1654
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - mountPath: /appconfig/json-settings
              name: config
              readOnly: true
            - mountPath: /appdata
              name: app-data
            - mountPath: /apptemp
              name: app-temp
            - mountPath: /applogs
              name: app-logs
            - mountPath: /tmp
              name: runtime-temp
          ports:
          - containerPort: 5998
            name: http
            protocol: TCP
          resources:
            limits:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 1Gi
      volumes:
        - name: config
          configMap:
            name: sample-config
        - name: app-data
          emptyDir: {}
        - name: app-temp
          emptyDir: {}
        - name: app-logs
          emptyDir: {}
        - name: runtime-temp
          emptyDir: {}
