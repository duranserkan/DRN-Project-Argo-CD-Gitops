apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization #kubectl apply -k --dry-run=client -o yaml ./
resources:
  - ../base
namespace: drn-project-develop
#namePrefix: develop-
#nameSuffix: -0.2.2-preview002
images:
  - name: duranserkan/drn-project-sample
    newTag: 0.10.1-preview001
    digest: sha256:10300ff82bd730dc77126c3a71bdea62c34ac32986ad44984b83293655347a41
replicas:
  - name: sample
    count: 1
configMapGenerator:
  - name: sample-config
    files:
      - mounted-settings.json
patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: sample
