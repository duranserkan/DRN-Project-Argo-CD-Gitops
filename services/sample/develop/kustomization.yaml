apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization #kubectl apply -k --dry-run=client -o yaml ./
resources:
  - ../base
namespace: drn-project-develop
#namePrefix: develop-
#nameSuffix: -0.2.2-preview002
images:
  - name: duranserkan/drn-project-sample
    newTag: 0.10.1-preview002
    digest: sha256:3102be614fada35b8d09d3e9d340afd3ce2cef67fae133d066d41e4fe189ae2d
replicas:
  - name: sample
    count: 1
configMapGenerator:
  - name: sample-config
    files:
      - mounted-settings.json
patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: sample
