apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample
spec:
  template:
    spec:
      automountServiceAccountToken: false
      # Match the base: Trivy scans this partial manifest independently.
      securityContext:
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: postgresql
          secret:
            secretName: postgresql-app
      containers:
        - name: sample
          securityContext:
            runAsNonRoot: true
            runAsUser: 1654
            runAsGroup: 1654
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: postgresql
              mountPath: /appconfig/key-per-file-settings/postgres-password
              subPath: password
              readOnly: true
          resources:
            limits:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 1Gi
