apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql
  annotations:
    # Database retirement must be deliberate, including during Application deletion.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:d72ace96f5803b12c341bb5dac48532e8c1f92f69e8a717a59d779bfc038dea9
  enableSuperuserAccess: false
  postgresql:
    pg_hba:
      # Preserve the operator's preceding local and certificate replication rules.
      - hostnossl all all all reject
  # A single beta instance must not block node drains.
  enablePDB: false
  inheritedMetadata:
    annotations:
      linkerd.io/inject: disabled
  bootstrap:
    initdb:
      database: drnDb
      owner: drn
  storage:
    size: 8Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
