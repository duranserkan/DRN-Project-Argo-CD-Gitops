name: Shared CI

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        description: Required for branch analysis. Tag runs only scan with Trivy.
        required: false

permissions: {}

jobs:
  backend:
    if: github.ref_type == 'branch'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build, test and analyze bootstraps
        uses: ./.github/actions/dotnet-sonar-scan
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}

  trivy:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan file system vulnerabilities
        uses: ./.github/actions/scan-file-system-vulnerabilities

  codeql:
    if: github.ref_type == 'branch'
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run CodeQL scan
        uses: ./.github/actions/codeql-scan

  gatekeeper:
    if: ${{ always() && github.ref_type == 'branch' }}
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [backend, trivy, codeql]
    steps:
      - name: Verify required jobs completed successfully
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          if [ "$BACKEND_RESULT" != "success" ] || [ "$TRIVY_RESULT" != "success" ] || [ "$CODEQL_RESULT" != "success" ]; then
            echo "Required checks did not all pass."
            echo "backend: $BACKEND_RESULT"
            echo "trivy: $TRIVY_RESULT"
            echo "codeql: $CODEQL_RESULT"
            exit 1
          fi
          echo "Required checks passed."
