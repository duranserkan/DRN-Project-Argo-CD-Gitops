# PR source executes only on hosted runners, without repository secrets.
# Sonar analysis belongs to the protected master workflow.
name: pull-request

on:
  pull_request:
    branches: [develop, master]

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

jobs:
  charts:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate charts
        uses: ./.github/actions/chart-validate

  dotnet:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate bootstraps
        uses: ./.github/actions/dotnet-validate

  trivy:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan repository
        uses: ./.github/actions/scan-file-system-vulnerabilities

  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: csharp
            build-mode: manual
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Analyze repository
        uses: ./.github/actions/codeql-scan
        with:
          language: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

  dependency-review:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}

  gatekeeper:
    if: ${{ always() }}
    needs: [charts, dotnet, trivy, codeql, dependency-review]
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify all required jobs succeeded
        env:
          CHARTS_RESULT: ${{ needs.charts.result }}
          DOTNET_RESULT: ${{ needs.dotnet.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: |
          if [ "$CHARTS_RESULT" != success ] || [ "$DOTNET_RESULT" != success ] || [ "$TRIVY_RESULT" != success ] || [ "$CODEQL_RESULT" != success ] || [ "$DEPENDENCY_REVIEW_RESULT" != success ]; then
            echo "Required checks did not all pass."
            echo "charts: $CHARTS_RESULT"
            echo "dotnet: $DOTNET_RESULT; trivy: $TRIVY_RESULT; codeql: $CODEQL_RESULT"
            echo "dependency-review: $DEPENDENCY_REVIEW_RESULT"
            exit 1
          fi
          echo "Required checks passed."
