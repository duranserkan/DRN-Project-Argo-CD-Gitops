name: master

on:
  push:
    branches: ["master"]
    tags:
      - "[0-9][0-9][0-9][0-9].*"
      - "!*-preview*"
  schedule:
    - cron: '29 13 * * 0' # Every Sunday at 13:29 UTC

concurrency:
  group: master-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/ci.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
