name: master

on:
  push:
    branches: ["master"]
    tags:
      - "[0-9][0-9][0-9][0-9].*"
      - "!*-preview*"
  schedule:
    - cron: '29 13 * * 0' # Every Sunday at 13:29 UTC

concurrency:
  group: master-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

jobs:
  charts:
    if: github.ref_type != 'tag'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate charts
        uses: ./.github/actions/chart-validate

  dotnet:
    if: github.ref_type != 'tag'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate bootstraps with Sonar analysis
        uses: ./.github/actions/dotnet-validate
        with:
          sonar-analysis: 'true'
          sonar-token: ${{ secrets.SONAR_TOKEN }}

  trivy:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan repository
        uses: ./.github/actions/scan-file-system-vulnerabilities

  codeql:
    if: github.ref_type != 'tag'
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: csharp
            build-mode: manual
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Analyze repository
        uses: ./.github/actions/codeql-scan
        with:
          language: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

  gatekeeper:
    if: ${{ always() && github.ref_type != 'tag' }}
    needs: [charts, dotnet, trivy, codeql]
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify all required jobs succeeded
        env:
          CHARTS_RESULT: ${{ needs.charts.result }}
          DOTNET_RESULT: ${{ needs.dotnet.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          if [ "$CHARTS_RESULT" != success ] || [ "$DOTNET_RESULT" != success ] || [ "$TRIVY_RESULT" != success ] || [ "$CODEQL_RESULT" != success ]; then
            echo "Required checks did not all pass."
            echo "charts: $CHARTS_RESULT"
            echo "dotnet: $DOTNET_RESULT; trivy: $TRIVY_RESULT; codeql: $CODEQL_RESULT"
            exit 1
          fi
          echo "Required checks passed."
