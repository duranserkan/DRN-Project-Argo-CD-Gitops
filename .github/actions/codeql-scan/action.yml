name: CodeQL Scan
description: Analyze GitHub Actions workflows without application builds.
runs:
  using: composite
  steps:
    - name: Initialize CodeQL
      uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        tools: linked # CodeQL 2.27.2, bound to the action commit.
        languages: actions

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        category: /language:actions
