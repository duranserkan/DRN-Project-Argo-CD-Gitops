name: CodeQL Scan
description: Analyze GitHub Actions workflows without application builds.
runs:
  using: composite
  steps:
    - name: Initialize CodeQL
      uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        tools: linked # CodeQL 2.27.1, bound to the action commit.
        languages: actions

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        category: /language:actions
