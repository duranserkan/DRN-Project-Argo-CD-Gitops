name: Scan file system vulnerabilities
description: Scan vulnerabilities, secrets and misconfigurations with Trivy and upload SARIF.
runs:
  using: composite
  steps:
    - name: Scan vulnerabilities, secrets and misconfigurations
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        version: v0.76.1
        scan-type: fs
        scan-ref: .
        scanners: vuln,secret,misconfig
        format: sarif
        output: trivy-results.sarif
        exit-code: '1'
        severity: HIGH,CRITICAL
        limit-severities-for-sarif: 'true'

    - name: Upload Trivy results
      if: ${{ !cancelled() && hashFiles('trivy-results.sarif') != '' }}
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: trivy-results.sarif
        category: trivy-file-system-scan
