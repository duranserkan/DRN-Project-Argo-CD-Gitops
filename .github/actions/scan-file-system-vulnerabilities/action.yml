name: Scan Vulnerabilities
description: Scan repository vulnerabilities, secrets and misconfigurations with Trivy and upload SARIF.
runs:
  using: "composite"
  steps:
    - name: Run Trivy vulnerability scanner in fs mode
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        version: 'v0.75.0'
        scan-type: 'fs'
        scan-ref: '.'
        scanners: 'vuln,secret,misconfig'
        format: 'sarif'
        output: 'trivy-results.sarif'
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      # Keep scanner failures visible without adding a missing-report upload error.
      if: ${{ !cancelled() && hashFiles('trivy-results.sarif') != '' }}
      with:
        sarif_file: 'trivy-results.sarif'
        category: trivy-file-system-scan
